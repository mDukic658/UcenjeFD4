<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue JS</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <div id="app">
        <p>Trenutni broj</p>
        <h1>
            {{brojac}}
        </h1>
        <button class="uvecaj" @click="uvecaj">Uvećaj</button>
        <button class="umanji" @click="umanji">Umanji</button>
        <button class="uvecajZaDva" @click="uvecajZaDva">Uvećaj za 2</button>
        <button class="umanjiZaDva" @click="umanjiZaDva">Umanji za 2</button>
        <div v-if="upozori">
            Broj ne može biti manji od 0!
        </div>
    </div>

    <script src="./js/vue.3.5.42.js"></script>
    <script src="./js/app.js"></script>

</body>

</html>
