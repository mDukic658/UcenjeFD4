<html>

<head>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1 x-data="{ poruka: 'Ja ❤️ Alpine' }" x-text="poruka"></h1>

    <div x-data="{ count: 0 }">
        <button x-on:click="count++">Povećanje</button>
        <button x-on:click="count--"> Umanjenje </button>
        
        <span x-text="count"></span>
    </div>

</body>
</html>
