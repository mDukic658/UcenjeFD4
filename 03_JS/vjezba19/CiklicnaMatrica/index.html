<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ciklična Matrica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header>
            <h1 class="glow-text">Ciklična Matrica</h1>
            <p class="subtitle">Interaktivni generator spiralne matrice</p>
        </header>

        <main>
            <div class="controls glass-panel">
                <div class="input-group">
                    <label for="rows">Broj redova:</label>
                    <select id="rows">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option selected value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                       option[value="$"]{$}*90


                    </select>
                </div>
                <div class="input-group">
                    <label for="cols">Broj stupaca:</label>
                    <select id="cols">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option selected value="5">5</option>
                        <option value="6">6</option>
                        <option value="7">7</option>
                        <option value="8">8</option>
                        <option value="9">9</option>
                        <option value="10">10</option>
                    </select>
                </div>
                <button id="generateBtn" class="primary-btn">Generiraj Matricu</button>
            </div>

            <div class="matrix-wrapper glass-panel">
                <div id="matrixContainer" class="matrix-grid">
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
